name: job-alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs by a few minutes under load
  workflow_dispatch:

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: job-alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-alerts/requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore seen-jobs state
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: job-alerts/.state
          key: job-alerts-state-${{ github.run_id }}
          restore-keys: job-alerts-state-
      - name: Poll and email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m jobalerts.main
      - name: Save seen-jobs state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: job-alerts/.state
          key: job-alerts-state-${{ github.run_id }}
